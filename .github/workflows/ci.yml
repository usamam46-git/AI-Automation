name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Database name MUST end in `_test`. tests/conftest.py hard-exits
        # otherwise: the suite TRUNCATEs every table around every test, and the
        # guard exists because a run against a dev database on 2026-08-15
        # destroyed real data. The service container here is ephemeral, so the
        # name is the only thing that needs to satisfy it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aap_user
          POSTGRES_PASSWORD: aap_pass
          POSTGRES_DB: aap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Must be Poetry 2.x: apps/api/poetry.lock is lock-version 2.1, which
      # Poetry 1.8.x refuses to read ("lock file is not compatible with the
      # current version of Poetry"). Keep this in step with whatever generated
      # the lock — bumping one without the other breaks install, not tests.
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('apps/api/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project root
        run: poetry install --no-interaction

      - name: Run Ruff Linter
        run: poetry run ruff check .

      - name: Run Ruff Formatter Check
        run: poetry run ruff format --check .

      # Settings() has three REQUIRED fields with no default (SECRET_KEY,
      # JWT_SECRET_KEY, INTEGRATION_ENCRYPTION_KEY) and apps/api/.env is
      # gitignored, so every one of them must be supplied here or `import
      # src.core.config` raises a ValidationError and the whole suite errors on
      # collection. These are throwaway CI values, not secrets.
      # INTEGRATION_ENCRYPTION_KEY must base64-decode to exactly 32 bytes —
      # core/encryption.py._key() rejects anything else.
      - name: Setup DB and Run Pytest
        env:
          SECRET_KEY: test_secret_key_12345
          JWT_SECRET_KEY: test_jwt_secret_key_12345
          INTEGRATION_ENCRYPTION_KEY: Bw4VHCMqMTg/Rk1UW2JpcHd+hYyTmqGor7a9xMvS2eA=
          DATABASE_URL: postgresql+asyncpg://aap_user:aap_pass@localhost:5432/aap_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: |
          poetry run alembic upgrade head
          poetry run python src/db/seed_roles.py
          poetry run pytest

  web-lint-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # vitest over the pure lib/ modules (graph-validation, graph-mapping,
      # output-schema, run-status, run-timeline). graph-validation duplicates the
      # backend's eight rules in TypeScript, so this suite is the only thing
      # guarding that drift — it must run in CI, not just locally.
      - name: Run unit tests
        run: npm test

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
