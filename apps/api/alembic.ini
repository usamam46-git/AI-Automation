# alembic.ini — Alembic configuration for AAP backend migrations
# Run from the apps/api/ directory: alembic upgrade head

[alembic]
# Path to the migration scripts directory (relative to this file's location)
script_location = alembic

# Template for new migration file names
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d%(second).2d — timestamp prefix
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for the timestamp prefix
timezone = UTC

# The database URL is resolved programmatically in env.py from settings,
# so the sqlalchemy.url here is a placeholder (it's overridden in env.py).
# You can set DATABASE_URL env var or .env file instead.
sqlalchemy.url = postgresql://aap_user:aap_pass@localhost:5432/aap_db

# Do not truncate long SQL in migration output
truncate_slug_length = 60


[post_write_hooks]
# Optionally auto-format generated migration files with ruff
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
