[tool.poetry]
name = "aap-api"
version = "0.1.0"
description = "AI Automation Platform — FastAPI Backend"
authors = ["AAP Engineering Team"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }

# Database — SQLAlchemy async + Postgres driver
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = "^0.29.0"          # async PostgreSQL driver
alembic = "^1.13.1"

# pgvector — Python bindings for the pgvector Postgres extension
pgvector = "^0.3.2"

# Validation / serialization
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
email-validator = "^2.1.0"

# Auth
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["argon2"] }
python-multipart = "^0.0.9"   # form-data for OAuth2 flows

# Background jobs
celery = { version = "^5.4.0", extras = ["redis"] }
redis = { version = "^5.0.4", extras = ["hiredis"] }

# AI / LLM
langchain = "^0.2.0"
langgraph = ">=0.2.57"
langsmith = "^0.1.0"
openai = "^1.30.0"

# Object storage (MinIO / S3-compatible)
boto3 = "^1.34.0"

# Observability
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
sentry-sdk = { version = "^2.5.0", extras = ["fastapi"] }
prometheus-client = "^0.20.0"

# Utilities
python-dotenv = "^1.0.1"
structlog = "^24.1.0"        # structured JSON logging
psycopg2-binary = "^2.9.12"
cachetools = "^7.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"           # async test client for FastAPI
factory-boy = "^3.3.0"
mypy = "^1.10.0"
ruff = "^0.4.0"             # linter + formatter
pre-commit = "^3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 150
target-version = "py312"
lint.select = ["E", "F", "I", "UP", "B", "SIM"]
lint.ignore = ["B008", "B904", "E402", "F821", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
